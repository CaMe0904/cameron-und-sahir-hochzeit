<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
<!-- Netlify Forms detection: Netlify scans static HTML at deploy time. The site itself is bundled,
     so its hidden forms are not visible to the scanner — this file registers them. Do not delete. -->
<form name="rsvp" data-netlify="true" netlify-honeypot="website" hidden><input type="text" name="name"><input type="email" name="email"><input type="text" name="attendance"><input type="text" name="adults"><input type="text" name="children"><input type="text" name="guestNames"><input type="text" name="dietary"><input type="text" name="song"><textarea name="message"></textarea><input type="text" name="website"></form>
<form name="tippspiel" data-netlify="true" hidden><input type="text" name="name"><input type="text" name="q1"><input type="text" name="q2"><input type="text" name="q3"><input type="text" name="q4"><input type="text" name="q5"><input type="text" name="q6"><input type="text" name="q7"><input type="text" name="q8"></form>
<form name="zeitkapsel" data-netlify="true" hidden><input type="text" name="name"><textarea name="message"></textarea><input type="text" name="openAt"></form>
</body>
</html>
